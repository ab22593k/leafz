name: leafz
description: organiq puzzle where the pieces hum a forgotten melody

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.1.0

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.4
  collection: ^1.19.1
  flutter_riverpod: ^3.3.2
  equatable: ^2.0.8
  package_info_plus: ^10.1.0
  share_plus: ^13.0.1
  path_provider: ^2.0.10
  http: ^1.6.0
  url_launcher: ^6.1.2
  font_awesome_flutter: ^11.0.0
  desktop_window: ^0.4.3
  xdg_directories: ^1.1.0
  cross_file: ^0.3.5+2
  shared_preferences: ^2.3.0
  go_router: ^17.2.3
  hugeicons: ^1.1.7
  dynamic_color: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4
  path_provider_platform_interface: ^2.0.4
  plugin_platform_interface: ^2.1.2
  fake_async: ^1.3.2
  flutter_lints: ^6.0.0
  checks: ^0.3.1
  flutter_checks: ^0.1.2
  test: ^1.31.0
  fastforge: ^0.6.9

flutter:
  generate: true
  uses-material-design: true
  assets:
    # Flutter directory entries are non-recursive — each subdirectory
    # must be listed explicitly.
    - assets/images/
    - assets/images/solved/
    - assets/images/background/

  shaders:
    - shaders/aurora.frag
  fonts:
    # Editorial display voice. Variable weight axis (100–900); the app
    # drives it through `FontVariation` rather than static cuts, so one
    # 104 KB file covers every weight in the type scale.
    - family: NotoSerif
      fonts:
        - asset: assets/fonts/NotoSerif/NotoSerif-Variable.ttf
    # Interface voice: titles, body, labels, buttons, tile numerals.
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat/Montserrat-Variable.ttf

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app-icon-with-dash-ltr.png"
